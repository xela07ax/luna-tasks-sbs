server:
  port: 8080
  read_timeout: 10s
  write_timeout: 10s
  cors_allowed_origins:
    - "*"
    - "http://localhost:5173"

database:
  host: "localhost"
  port: 3306
  user: "luna_user"
  password: "luna_password"
  dbname: "luna_tasks"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0

auth:
  public_key_path: "./certs/public.pem"
  private_key_path: "./certs/private.pem"
  access_token_ttl: 15m
  refresh_token_ttl: 168h # 7 дней

rate_limit:
  requests_per_minute: 100
  burst: 100

metrics:
  enabled: true
  port: 9090

version: '3.8'

services:
  mysql-test:
    image: mysql:8.0
    container_name: luna-tasks-mysql-test
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: luna_tasks_test
      MYSQL_USER: test_user
      MYSQL_PASSWORD: test_pass
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password

  redis-test:
    image: redis:7-alpine
    container_name: luna-tasks-redis-test
    ports:
      - "6379:6379"